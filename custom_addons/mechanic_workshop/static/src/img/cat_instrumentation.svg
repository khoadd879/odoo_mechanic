<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ssBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="25%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="dialBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <filter id="gaugeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#gaugeShadow)">
    <!-- Bottom threaded process connection (1/2" NPT / G1/2B) -->
    <rect x="182" y="275" width="36" height="40" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
    <path d="M182,285 L218,285 M182,295 L218,295 M182,305 L218,305" stroke="#374151" stroke-width="2"/>
    <!-- Hex nut -->
    <path d="M172,255 L228,255 L235,275 L165,275 Z" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>

    <!-- Outer Stainless Steel Bezel -->
    <circle cx="200" cy="150" r="115" fill="url(#ssBezel)" stroke="#374151" stroke-width="2.5"/>
    <!-- Dial face -->
    <circle cx="200" cy="150" r="98" fill="url(#dialBg)" stroke="#d1d5db" stroke-width="1.5"/>

    <!-- Scale ticks and markings -->
    <!-- Arc for safe zone -->
    <path d="M130,200 A80,80 0 0,1 270,200" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.4"/>
    <path d="M245,100 A80,80 0 0,1 270,200" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.5"/>

    <!-- Major and minor ticks -->
    <g stroke="#1f2937" stroke-width="2">
      <line x1="120" y1="150" x2="135" y2="150"/>
      <line x1="143" y1="94" x2="154" y2="105"/>
      <line x1="200" y1="70" x2="200" y2="85"/>
      <line x1="257" y1="94" x2="246" y2="105"/>
      <line x1="280" y1="150" x2="265" y2="150"/>
    </g>

    <!-- Dial numbers -->
    <text x="145" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">0</text>
    <text x="160" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">10</text>
    <text x="200" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">25</text>
    <text x="235" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">40</text>
    <text x="250" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">60</text>

    <!-- Brand / Units text -->
    <text x="200" y="135" font-family="sans-serif" font-size="9" font-weight="bold" fill="#004b2b" text-anchor="middle">SRE INDUSTRIAL</text>
    <text x="200" y="185" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">bar / PSI</text>
    <text x="200" y="198" font-family="sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">CL 1.0 • 316L SS</text>

    <!-- Pointer / Needle -->
    <g transform="rotate(25 200 150)">
      <polygon points="197,150 200,80 203,150" fill="#dc2626"/>
      <circle cx="200" cy="150" r="10" fill="#1f2937"/>
      <circle cx="200" cy="150" r="4" fill="#9ca3af"/>
    </g>
  </g>
</svg>
