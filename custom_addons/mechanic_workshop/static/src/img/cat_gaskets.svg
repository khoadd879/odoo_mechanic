<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="outerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="25%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="75%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="innerRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <filter id="gasketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#gasketShadow)">
    <!-- Outer Centering Ring (Green Painted Carbon Steel) -->
    <circle cx="200" cy="200" r="130" fill="url(#outerRingGrad)" stroke="#14532d" stroke-width="2"/>
    
    <!-- Outer Ring Stamping / Markings -->
    <text x="200" y="85" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ASME B16.20 316/GRAPHITE</text>
    <text x="200" y="325" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">DN80 / 3" CL.300 PN40</text>

    <!-- Sealing Element (Spiral Wound Winding - V-shaped Metal Strip + Flexible Graphite Filler) -->
    <circle cx="200" cy="200" r="102" fill="url(#spiralGrad)" stroke="#111827" stroke-width="2"/>
    
    <!-- Concentric spiral grooves representation -->
    <circle cx="200" cy="200" r="96" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="200" cy="200" r="90" fill="none" stroke="#374151" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="84" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="200" cy="200" r="78" fill="none" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Inner Retaining Ring (Solid 316 Stainless Steel) -->
    <circle cx="200" cy="200" r="72" fill="url(#innerRingGrad)" stroke="#374151" stroke-width="2"/>
    <!-- Center Bore / Port hole -->
    <circle cx="200" cy="200" r="54" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>

    <!-- Flange Stud Bolt Kit preview in corner -->
    <g transform="translate(260, 240)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
      <path d="M10,0 L10,24 M20,0 L20,24 M30,0 L30,24 M40,0 L40,24 M50,0 L50,24 M60,0 L60,24 M70,0 L70,24" stroke="#4b5563" stroke-width="1"/>
      <!-- Nut -->
      <polygon points="55,-4 75,-4 82,12 75,28 55,28 48,12" fill="#9ca3af" stroke="#1f2937" stroke-width="1.5"/>
    </g>
  </g>
</svg>
