<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="plcBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="plcScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>

  <!-- DIN Rail base -->
  <rect x="15" y="88" width="170" height="24" rx="2" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="25" y="94" width="150" height="12" fill="#d1d5db"/>

  <!-- PLC Main Unit Module -->
  <rect x="42" y="30" width="116" height="140" rx="4" fill="url(#plcBody)" stroke="#111827" stroke-width="2"/>
  
  <!-- Top Terminal Blocks -->
  <rect x="50" y="34" width="100" height="18" rx="2" fill="url(#termGrad)" stroke="#4b5563" stroke-width="1"/>
  <circle cx="58" cy="43" r="3" fill="#1f2937"/>
  <circle cx="72" cy="43" r="3" fill="#1f2937"/>
  <circle cx="86" cy="43" r="3" fill="#1f2937"/>
  <circle cx="100" cy="43" r="3" fill="#1f2937"/>
  <circle cx="114" cy="43" r="3" fill="#1f2937"/>
  <circle cx="128" cy="43" r="3" fill="#1f2937"/>
  <circle cx="142" cy="43" r="3" fill="#1f2937"/>

  <!-- LCD Status Screen -->
  <rect x="52" y="60" width="96" height="42" rx="3" fill="url(#plcScreen)" stroke="#10b981" stroke-width="1.5"/>
  <text x="58" y="76" font-family="monospace" font-size="9" font-weight="bold" fill="#34d399">RUN  OK  NET</text>
  <text x="58" y="92" font-family="monospace" font-size="10" font-weight="bold" fill="#a7f3d0">DI:8/DO:6</text>

  <!-- Status LED Indicators -->
  <circle cx="58" cy="116" r="4" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
  <text x="66" y="119" font-family="sans-serif" font-size="7" font-weight="bold" fill="#e5e7eb">PWR</text>

  <circle cx="95" cy="116" r="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="103" y="119" font-family="sans-serif" font-size="7" font-weight="bold" fill="#e5e7eb">COM</text>

  <circle cx="132" cy="116" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <text x="140" y="119" font-family="sans-serif" font-size="7" font-weight="bold" fill="#e5e7eb">FLT</text>

  <!-- Bottom Terminal Blocks -->
  <rect x="50" y="146" width="100" height="20" rx="2" fill="url(#termGrad)" stroke="#4b5563" stroke-width="1"/>
  <circle cx="58" cy="156" r="3" fill="#1f2937"/>
  <circle cx="72" cy="156" r="3" fill="#1f2937"/>
  <circle cx="86" cy="156" r="3" fill="#1f2937"/>
  <circle cx="100" cy="156" r="3" fill="#1f2937"/>
  <circle cx="114" cy="156" r="3" fill="#1f2937"/>
  <circle cx="128" cy="156" r="3" fill="#1f2937"/>
  <circle cx="142" cy="156" r="3" fill="#1f2937"/>
</svg>
