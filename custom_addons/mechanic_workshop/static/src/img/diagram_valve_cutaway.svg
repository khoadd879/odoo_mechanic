<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <style>
      .dim-line { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: none; }
      .dim-text { fill: #1d4ed8; font-family: monospace; font-size: 11px; font-weight: bold; }
      .center-line { stroke: #dc2626; stroke-width: 1; stroke-dasharray: 8,4,2,4; }
      .obj-line { stroke: #111827; stroke-width: 2; fill: none; }
      .hatch { stroke: #9ca3af; stroke-width: 1; }
    </style>
  </defs>

  <!-- Technical Drawing Background (White with subtle technical blueprint grid) -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Title Block / Drawing Standard -->
  <rect x="10" y="10" width="480" height="380" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="25" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4b5563">SRE COMMERCIAL • ENGINEERING DIMENSION DRAWING</text>
  <text x="465" y="30" font-family="monospace" font-size="10" fill="#004b2b" text-anchor="end" font-weight="bold">SCALE 1:2 • EN 1092-1 / ASME B16.5</text>
  
  <!-- Centerlines -->
  <line x1="60" y1="240" x2="440" y2="240" class="center-line"/>
  <line x1="250" y1="50" x2="250" y2="340" class="center-line"/>

  <!-- Valve Body Outline (Flanged Globe Pattern) -->
  <!-- Left Flange -->
  <rect x="90" y="180" width="25" height="120" rx="2" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <circle cx="102" cy="200" r="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <circle cx="102" cy="280" r="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>

  <!-- Right Flange -->
  <rect x="385" y="180" width="25" height="120" rx="2" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <circle cx="397" cy="200" r="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <circle cx="397" cy="280" r="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>

  <!-- Valve Body Bowl -->
  <path d="M115,220 Q160,220 180,190 L180,150 L320,150 L320,190 Q340,220 385,220 L385,260 Q340,260 320,290 L180,290 Q160,260 115,260 Z" fill="#fafafa" stroke="#111827" stroke-width="2"/>

  <!-- Bonnet & Stuffing Box -->
  <rect x="195" y="110" width="110" height="40" fill="#e5e7eb" stroke="#111827" stroke-width="2"/>
  <rect x="210" y="80" width="80" height="30" fill="#d1d5db" stroke="#111827" stroke-width="2"/>

  <!-- Valve Stem & Plug -->
  <line x1="250" y1="60" x2="250" y2="240" stroke="#374151" stroke-width="6"/>
  <!-- Contoured Plug (Equal Percentage) -->
  <path d="M230,230 L270,230 L260,255 L240,255 Z" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <!-- Seat Ring -->
  <rect x="220" y="248" width="18" height="14" fill="#dc2626" opacity="0.7"/>
  <rect x="262" y="248" width="18" height="14" fill="#dc2626" opacity="0.7"/>

  <!-- Dimension Lines -->
  <!-- Face-to-Face Dimension (A) -->
  <line x1="90" y1="330" x2="410" y2="330" class="dim-line"/>
  <path d="M90,330 L100,326 L100,334 Z M410,330 L400,326 L400,334 Z" fill="#2563eb"/>
  <line x1="90" y1="302" x2="90" y2="345" stroke="#9ca3af" stroke-width="1"/>
  <line x1="410" y1="302" x2="410" y2="345" stroke="#9ca3af" stroke-width="1"/>
  <text x="250" y="324" class="dim-text" text-anchor="middle">DIM A: 310 mm (Face-to-Face)</text>

  <!-- Total Height Dimension (B) -->
  <line x1="445" y1="60" x2="445" y2="300" class="dim-line"/>
  <path d="M445,60 L441,70 L449,70 Z M445,300 L441,290 L449,290 Z" fill="#2563eb"/>
  <line x1="250" y1="60" x2="460" y2="60" stroke="#9ca3af" stroke-width="1"/>
  <line x1="410" y1="300" x2="460" y2="300" stroke="#9ca3af" stroke-width="1"/>
  <text x="455" y="185" class="dim-text" transform="rotate(90 455 185)" text-anchor="middle">DIM B: 420 mm (Total Height)</text>

  <!-- Flange Diameter (C) -->
  <line x1="55" y1="180" x2="55" y2="300" class="dim-line"/>
  <path d="M55,180 L51,190 L59,190 Z M55,300 L51,290 L59,290 Z" fill="#2563eb"/>
  <line x1="50" y1="180" x2="90" y2="180" stroke="#9ca3af" stroke-width="1"/>
  <line x1="50" y1="300" x2="90" y2="300" stroke="#9ca3af" stroke-width="1"/>
  <text x="45" y="245" class="dim-text" transform="rotate(-90 45 245)" text-anchor="middle">Ø 200 mm (DN80)</text>

  <!-- Engineering Notes -->
  <g transform="translate(25, 350)">
    <text x="0" y="12" font-family="monospace" font-size="9" fill="#4b5563">1. FLANGES DRILLED TO EN 1092-2 PN16 / FORM B</text>
    <text x="0" y="24" font-family="monospace" font-size="9" fill="#4b5563">2. MATERIAL: CAST STEEL GP240GH+N • STEM: AISI 316Ti</text>
  </g>
</svg>
