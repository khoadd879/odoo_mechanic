<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <style>
      .wire-pwr { stroke: #dc2626; stroke-width: 2; fill: none; }
      .wire-com { stroke: #111827; stroke-width: 2; fill: none; }
      .wire-sig { stroke: #2563eb; stroke-width: 2; fill: none; }
      .wire-fdb { stroke: #16a34a; stroke-width: 2; fill: none; }
      .term-box { fill: #f3f4f6; stroke: #374151; stroke-width: 1.5; }
      .term-num { font-family: monospace; font-size: 11px; font-weight: bold; fill: #111827; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="10" y="10" width="480" height="380" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="25" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4b5563">SRE COMMERCIAL • WIRING & TERMINAL INTERFACE SCHEMATIC</text>
  <text x="465" y="30" font-family="monospace" font-size="10" fill="#004b2b" text-anchor="end" font-weight="bold">ANALOG 0(2)-10V / 4-20mA DDC HOOKUP</text>

  <!-- Controller Terminal Block (DDC / PLC) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="110" height="230" rx="4" class="term-box"/>
    <text x="55" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">PLC / DDC</text>
    <line x1="0" y1="35" x2="110" y2="35" stroke="#9ca3af"/>

    <rect x="90" y="60" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="100" y="74" class="term-num" text-anchor="middle">24V</text>

    <rect x="90" y="105" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="100" y="119" class="term-num" text-anchor="middle">GND</text>

    <rect x="90" y="150" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="100" y="164" class="term-num" text-anchor="middle">AO1</text>

    <rect x="90" y="195" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="100" y="209" class="term-num" text-anchor="middle">AI1</text>
  </g>

  <!-- Field Device Terminal Block (Actuator / Positioner) -->
  <g transform="translate(340, 70)">
    <rect x="0" y="0" width="120" height="230" rx="4" class="term-box"/>
    <text x="60" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004b2b" text-anchor="middle">FIELD DEVICE</text>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#9ca3af"/>

    <rect x="0" y="60" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="10" y="74" class="term-num" text-anchor="middle">1</text>
    <text x="30" y="74" font-family="monospace" font-size="10" fill="#dc2626">24V AC/DC (~)</text>

    <rect x="0" y="105" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="10" y="119" class="term-num" text-anchor="middle">2</text>
    <text x="30" y="119" font-family="monospace" font-size="10" fill="#111827">COM (⏚)</text>

    <rect x="0" y="150" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="10" y="164" class="term-num" text-anchor="middle">3</text>
    <text x="30" y="164" font-family="monospace" font-size="10" fill="#2563eb">Y: 0-10V In</text>

    <rect x="0" y="195" width="20" height="20" fill="#e5e7eb" stroke="#111827"/>
    <text x="10" y="209" class="term-num" text-anchor="middle">5</text>
    <text x="30" y="209" font-family="monospace" font-size="10" fill="#16a34a">U: 2-10V Out</text>
  </g>

  <!-- Wiring connections with wire colors -->
  <!-- Wire 1: 24V Power -->
  <path d="M150,140 L340,140" class="wire-pwr"/>
  <text x="240" y="133" font-family="monospace" font-size="9" fill="#dc2626" font-weight="bold">RED: +24V SUPPLY</text>

  <!-- Wire 2: Neutral / Common -->
  <path d="M150,185 L340,185" class="wire-com"/>
  <text x="240" y="178" font-family="monospace" font-size="9" fill="#111827" font-weight="bold">BLACK: COMMON (0V)</text>

  <!-- Wire 3: Control Command (AO1 -> Y) -->
  <path d="M150,230 L340,230" class="wire-sig"/>
  <text x="240" y="223" font-family="monospace" font-size="9" fill="#2563eb" font-weight="bold">BLUE: POSITION SETPOINT (0-10V DC)</text>

  <!-- Wire 4: Feedback (AI1 <- U) -->
  <path d="M150,275 L340,275" class="wire-fdb"/>
  <text x="240" y="268" font-family="monospace" font-size="9" fill="#16a34a" font-weight="bold">GREEN: POSITION FEEDBACK (2-10V DC)</text>

  <g transform="translate(25, 335)">
    <rect x="0" y="0" width="450" height="40" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="15" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0f172a">WIRING NOTE:</text>
    <text x="15" y="28" font-family="sans-serif" font-size="9" fill="#475569">Shielded twisted-pair cable (min 0.75 mm² / AWG 18) recommended. Connect shield at PLC ground only.</text>
  </g>
</svg>
