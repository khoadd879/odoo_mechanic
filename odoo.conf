[options]
; Odoo config for the Mechanic Workshop project.
; This file is mounted read-only into the Odoo container.

admin_passwd = mechanic_master_local
db_host = db
db_port = 5432
db_user = odoo
db_password = mechanic_local
db_name = mechanic_workshop

; Keep Odoo's native addons first, project-owned modules second,
; each cloned OCA repo last. Odoo 19 requires the addons path to contain
; module folders directly, so each OCA repo is listed individually.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/custom_addons,/mnt/oca_addons/brand,/mnt/oca_addons/product-attribute

http_port = 8069
http_interface = 0.0.0.0
gevent_port = 8072

limit_time_real = 300

log_level = info
log_handler = :INFO
list_db = False

dbfilter = ^mechanic_workshop$
proxy_mode = False

; Developer mode: read XML directly from disk, auto-reload on Python changes
dev_mode = reload,qweb,xml

